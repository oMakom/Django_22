{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Случайный магазин - Каталог</title>
    <!-- Подключаем Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet"/>
    <!-- Иконки Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.0/font/bootstrap-icons.min.css">

    <style>
        /* --- БЛОК CSS ДЛЯ МЕНЮ --- */
        .custom-menu .nav-link {
            color: rgba(255, 255, 255, 0.75) !important;
            padding: 0.6rem 1rem;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }
        .custom-menu .nav-link:hover {
            color: #fff !important;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .custom-menu .nav-link.active {
            color: #fff !important;
            background-color: #0d6efd;
        }
        /* --------------------------------------------- */
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Основной контейнер -->
    <div class="row m-0 flex-grow-1">

        <!-- ЛЕВАЯ КОЛОНКА: МЕНЮ -->
        {% include 'includes/inc_menu.html' %}
        <!-- правая КОЛОНКА -->
        {% block content %}
        {% endblock %}

    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
