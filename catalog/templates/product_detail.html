{% extends 'base.html' %}
{% block content %}
        <!-- ПРАВАЯ КОЛОНКА: Контент -->
        <div class="col p-0 bg-white">
            <div class="container-fluid py-4">

                <!-- Заголовок -->
                <h2 class="text-center text-dark mb-4">{{product.name}}</h2>

                <!-- СЕТКА ТОВАРОВ -->
                <!-- gx-4 / gy-4 - стандартные отступы Bootstrap -->
                <div class="row gx-4 gy-4">

                    <!-- Товар 1 -->
                    <div class="col-12 d-flex justify-content-center">
                        <div class="card h-100 border-0 shadow-sm d-flex flex-column">

                            <!-- Картинка-заглушкачерез Bootstrap Ratio -->
                            <!-- Это заменяет весь CSS для пропорций картинки -->
                            <div class="ratio ratio-4x3 bg-light">
                                <img src="{{ product.image.url }}" class="img-fluid position-absolute" alt="Фото отсутствует">
                            </div>

                            <!-- Тело карточки -->
                            <div class="card-body flex-grow-1 d-flex flex-column">
                                <p class="card-text mb-auto" o>Цена: {{product.price}} руб.</p>
                                <p class="card-text mb-auto">Категория: {{product.category}}.</p>
                                <p class="card-text mb-auto">Описние: {{product.description}}.</p>

                                <!-- Нижняя панель -->
                                <div class="mt-3 pt-3 border-top">
                                    <div class="d-flex justify-content-between align-items-center">
                                            <a href="{% url 'catalog:home' %}" class="btn btn-outline-primary w-50">Назад</a>
                                        <span class="text-muted small">Создано: {{product.created_at|date:"d M Y"}} Обновлено: {{product.updated_at|date:"d M Y"}} </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
