{% extends 'catalog/base.html' %}
{% block content %}

        <!-- ПРАВАЯ КОЛОНКА: Контент -->
        <div class="col p-0 bg-white">
            <div class="content-wrapper">
                <h1 class="card-title text-center mb-4">Каталог Категорий</h1>
                <p class="card-title text-center text-muted mb-5">Список всех категорий товаров</p>

                <div class="row gx-4">

                    <!-- Товары:  -->
                    {{% if categories %}
                        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                            {% for category in categories %}
                                <div class="col">
                                    <!-- Ссылка оборачивает всю карточку -->
                                    <a href="{% url 'catalog:category_products' category.id %}" class="text-decoration-none text-dark">
                                        <div class="card h-100 shadow-sm hover-shadow transition-all border-0">
                                            <div class="card-body d-flex align-items-center justify-content-center text-center p-4">
                                                <h4 class="card-title mb-0">{{ category.name }}</h4>
                                            </div>
                                            <div class="card-footer bg-white border-top-0 text-center pt-0">
                                                <span class="badge bg-light text-dark border">Перейти в раздел</span>
                                            </div>
                                        </div>
                                    </a>
                                </div>
                            {% endfor %}
                        </div>
                    {% else %}
                        <p class="text-center">Категории пока не добавлены.</p>
                    {% endif %}
                </div>
            </div>
        </div>
{% endblock %}
