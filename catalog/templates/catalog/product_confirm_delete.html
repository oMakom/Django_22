{% extends 'catalog/base.html' %}
{% block content %}

        <!-- ПРАВАЯ КОЛОНКА: Контент -->
        <h2>Форма создания поста</h2>
    <form method="post">
        <p class="card-text"> Вы точно хотите удалить пост: {{product_detail.name}} ?</p>
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
