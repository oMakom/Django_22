{% extends 'myblog/base.html' %}
{% block content %}

        <!-- ПРАВАЯ КОЛОНКА: Контент -->
        <div class="col p-0 bg-white">
            <div class="content-wrapper">
                <h1 class="card-title text-center mb-4"><--MyBlog--></h1>
                <p class="card-title text-center text-muted mb-5">Вы находитесь на странице моего блога</p>

                <div class="row gx-4">

                    <!-- Товары:  -->
                    {% for post in posts %}
                    <div class="col-12 col-md-4 mb-4 mb-md-0">
                        <div class="card product-card h-100">
                            <div class="card-body d-flex flex-column">
                                <!-- Серая шапка -->
                                <div class="card-header-custom">
                                    <h5 class="card-title text-center m-0 fw-bold text-dark">{{post.title}}</h5>
                                </div>
                                <!-- Контент карточки -->
                                <div class="card-content-body text-center">
                                    <h6 class="card-text text-muted flex-grow-1 mt-3">
                                        {{post.content|truncatechars:50}}
                                    </h6>
                                    <p class="card-text text-end text-muted small flex-grow-1">
                                        {{post.created_at}}
                                    </p>
                                    {% if post.preview_image %}
                                        <img src="{{ post.preview_image.url }}" class="img-fluid rounded mb-3" alt="Фото отсутствует" style="max-height: 250px; object-fit: cover;">
                                    {% endif %}
                                </div>
                                <div class="p-3 pt-0">
                                    <a href="{% url 'myblog:post_detail' post.pk %}"
                                       class="btn btn-outline-primary w-100">Читать</a>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}

                </div>
            </div>
        </div>
{% endblock %}
