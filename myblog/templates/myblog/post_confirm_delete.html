{% extends 'myblog/base.html' %}
{% block content %}

        <!-- ПРАВАЯ КОЛОНКА: Контент -->
        <h2>Форма создания поста</h2>
    <form method="post">
        <p class="card-text"> Вы точно хотите удалить пост: {{post.title}} ?</p>
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'myblog:post_detail' post.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
