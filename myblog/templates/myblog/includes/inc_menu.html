<div class="col-auto p-0" style="width: 240px;">
            <div class="d-flex flex-column justify-content-between h-100 flex-shrink-0 p-3 text-white bg-dark">
                <div>
                    <a class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                        <i class="bi bi-bootstrap me-1"  style="font-size: 1.7rem;"></i>
                        <h4 class="card-title text-center m-0">Меню</h4>
                    </a>
                    <hr class="text-white-50">
                    <ul class="nav flex-column custom-menu">
                        <li class="nav-item">
                            <a href="{% url 'myblog:posts_list' %}" class="nav-link"><i class="bi bi-house-door me-2"></i>Главная</a>
                        </li>
                        <li class="nav-item">
                            <a href="{% url 'myblog:post_create' %}" class="nav-link"><i class="bi bi-person-circle me-2"></i>Добавить</a>
                        </li>
                    </ul>
                </div>

                <div class="mt-auto">
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                            <div class="rounded-circle me-2 bg-white" style="width: 32px; height: 32px; display: flex; justify-content: center; font-size: 0.8rem; color: #333;"></div>
                            <strong>Пользователь</strong>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                            {% if user.is_authenticated %}
                                <li><hr class="dropdown-divider"></li>
                                <li class="dropdown-item">
                                    <form method="post" action="{% url 'users:logout' %}" style="display: inline">
                                        {% csrf_token %}
                                        <button type="submit" class="btn btn-link nav-link">Выйти</button>
                                    </form>
                                </li>
                            {% else %}
                                <li><a class="dropdown-item" href="{% url 'users:login' %}">Войти</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="{% url 'users:register' %}">Регистрация</a></li>
                            {% endif %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
